<svg xmlns="http://www.w3.org/2000/svg" id="svm-api-request-isometric" width="400" height="300" viewBox="0 0 400 300" fill="none" role="img" aria-label="API request animation"><title>API request animation</title><style>#svm-api-request-isometric{--a:var(--svm-accent,#5b6cf9);--ink:var(--svm-ink,#23283a)}#svm-api-request-isometric polygon,#svm-api-request-isometric path,#svm-api-request-isometric rect,#svm-api-request-isometric ellipse,#svm-api-request-isometric line,#svm-api-request-isometric circle{stroke:var(--svm-line,var(--ink));stroke-width:calc(var(--svm-stroke,1)*1.2);stroke-linejoin:round;stroke-linecap:round}#svm-api-request-isometric .nt{fill:var(--svm-nt,#fff)}#svm-api-request-isometric .w{fill:var(--svm-w,#fff)}#svm-api-request-isometric .nl{fill:var(--svm-nl,#e7e9f2)}#svm-api-request-isometric .nr{fill:var(--svm-nr,#cdd1e0)}#svm-api-request-isometric .at{fill:color-mix(in srgb,var(--a) 65%,#fff)}#svm-api-request-isometric .al,#svm-api-request-isometric .fa{fill:var(--a)}#svm-api-request-isometric .ar{fill:color-mix(in srgb,var(--a) 70%,#000)}#svm-api-request-isometric .rt{fill:#ffb3ad}#svm-api-request-isometric .rl,#svm-api-request-isometric .red{fill:#f0524a}#svm-api-request-isometric .rr{fill:#b9342d}#svm-api-request-isometric .gt{fill:#a6ecc9}#svm-api-request-isometric .gl,#svm-api-request-isometric .grn{fill:#20b26b}#svm-api-request-isometric .gr{fill:#15804c}#svm-api-request-isometric .f{fill:none}#svm-api-request-isometric .sa{stroke:var(--a)}#svm-api-request-isometric .sg{stroke:#20b26b}#svm-api-request-isometric .no{stroke:none}#svm-api-request-isometric .spin,#svm-api-request-isometric .grow,#svm-api-request-isometric .gx{transform-box:fill-box;transform-origin:50% 50%}#svm-api-request-isometric .grow{transform-origin:50% 100%}#svm-api-request-isometric .gx{transform-origin:0 50%}#svm-api-request-isometric text{font:600 12px system-ui,-apple-system,sans-serif;fill:var(--ink);opacity:.6;stroke:none}@media (prefers-reduced-motion:reduce){#svm-api-request-isometric *{animation:none!important}}#svm-api-request-isometric .dt{stroke:var(--ink);stroke-width:calc(var(--svm-stroke,1)*.75);opacity:.6;vector-effect:non-scaling-stroke}#svm-api-request-isometric .gh{fill:none;stroke-dasharray:3 4;opacity:.45;vector-effect:non-scaling-stroke}#svm-api-request-isometric .lb{font:600 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;opacity:.8}#svm-api-request-isometric .lbl line,#svm-api-request-isometric .lbl path{stroke:var(--ink);stroke-width:calc(var(--svm-stroke,1)*.8);vector-effect:non-scaling-stroke}#svm-api-request-isometric .req{animation:svm-api-request-isometric-q 3s linear infinite}#svm-api-request-isometric .res{opacity:0;animation:svm-api-request-isometric-s 3s linear 1.5s infinite}#svm-api-request-isometric .led{animation:svm-api-request-isometric-blink 1.2s ease-in-out infinite}#svm-api-request-isometric .l1{animation-delay:.4s}#svm-api-request-isometric .l2{animation-delay:.8s}#svm-api-request-isometric .lq{animation:svm-api-request-isometric-lq 3s linear infinite}#svm-api-request-isometric .ls{opacity:0;animation:svm-api-request-isometric-ls 3s linear 1.5s infinite}#svm-api-request-isometric .lq text{fill:var(--a);opacity:1}@keyframes svm-api-request-isometric-lq{0%{opacity:.35}8%,45%{opacity:1}55%,100%{opacity:.35}}@keyframes svm-api-request-isometric-ls{0%{opacity:.35}8%,45%{opacity:1}55%,100%{opacity:.35}}@keyframes svm-api-request-isometric-q{0%{transform:translate(0,0);opacity:0}8%{opacity:1}45%{transform:translate(87.5px,50.5px);opacity:1}50%,100%{transform:translate(87.5px,50.5px);opacity:0}}@keyframes svm-api-request-isometric-s{0%{transform:translate(0,0);opacity:0}8%{opacity:1}45%{transform:translate(-87.5px,-50.5px);opacity:1}50%,100%{transform:translate(-87.5px,-50.5px);opacity:0}}@keyframes svm-api-request-isometric-blink{0%,100%{opacity:.25}50%{opacity:1}}#svm-api-request-isometric .pt{fill:var(--svm-pt,#f1f2f7)}#svm-api-request-isometric .shf{fill:var(--svm-shadow,#c5c9dc);stroke:none;opacity:var(--svm-shf,0)}#svm-api-request-isometric .shs{fill:var(--svm-shsc,#0b0d1a);stroke:none;mix-blend-mode:multiply;transform:translateY(calc(var(--svm-shd,16)*1px))}#svm-api-request-isometric .s1{opacity:calc(var(--svm-shs,0)*var(--svm-sho,.32)*var(--svm-sb1,0))}#svm-api-request-isometric .s2{opacity:calc(var(--svm-shs,0)*var(--svm-sho,.32)*var(--svm-sb2,1))}#svm-api-request-isometric .s3{opacity:calc(var(--svm-shs,0)*var(--svm-sho,.32)*var(--svm-sb3,0))}#svm-api-request-isometric .s4{opacity:calc(var(--svm-shs,0)*var(--svm-sho,.32)*var(--svm-sb4,0))}</style><defs><filter id="svm-api-request-isometric-b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter><filter id="svm-api-request-isometric-b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><filter id="svm-api-request-isometric-b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter><filter id="svm-api-request-isometric-b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter></defs><polygon class="shs s1" points="156.7,58 390.5,193 243.3,278 9.5,143" filter="url(#svm-api-request-isometric-b1)"/><polygon class="shs s2" points="156.7,58 390.5,193 243.3,278 9.5,143" filter="url(#svm-api-request-isometric-b2)"/><polygon class="shs s3" points="156.7,58 390.5,193 243.3,278 9.5,143" filter="url(#svm-api-request-isometric-b3)"/><polygon class="shs s4" points="156.7,58 390.5,193 243.3,278 9.5,143" filter="url(#svm-api-request-isometric-b4)"/><polygon class="shf" points="156.7,58 390.5,193 243.3,278 9.5,143" transform="translate(0 12)"/><g><polygon class="nt pt" points="156.7,50 390.5,185 243.3,270 9.5,135"/><polygon class="nl" points="9.5,143 243.3,278 243.3,270 9.5,135"/><polygon class="nr" points="390.5,193 243.3,278 243.3,270 390.5,185"/></g><g transform="matrix(.866 .5 -.866 .5 156.7 50)"><rect class="f dt" x="6" y="6" width="258" height="158" r